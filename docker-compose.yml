# Laboratorio de Observabilidad — Infraestructura como Código
# Levanta apps (api-gateway + blockchain-node + frontend-app) y el stack completo: Prometheus, Loki,
# Alloy, Grafana, node-exporter y cAdvisor.
#
#   docker compose up -d --build      # levantar todo
#   docker compose down               # detener (conserva dashboards de Grafana)
#   docker compose down -v            # detener y borrar datos (reset total)

services:
  # ----------------------------- Aplicaciones Voting -----------------------------
  blockchain-node:
    build:
      context: ./apps/blockchain-core
      dockerfile: Dockerfile
    container_name: lab-blockchain-node
    volumes:
      - ./apps/blockchain-core/data:/data/db
    networks:
      - voting-network
    ports:
      - "30333:30333" # P2P para otros nodos
      - "9944:9944" # RPC/WebSocket para la API
    restart: unless-stopped

  api-gateway:
    build:
      context: ./apps/api-rust
      dockerfile: Dockerfile
    container_name: lab-api-gateway
    depends_on:
      - blockchain-node
      - database-aux
    environment:
      - DATABASE_URL=postgres://user:pass@database-aux:5432/voting_db
      - NODE_RPC_URL=http://blockchain-node:9944
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    networks:
      - voting-network
    ports:
      - "8080:8080"
    restart: always

  database-aux:
    image: postgres:16-alpine
    container_name: lab-database-aux
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: voting_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voting-network
    restart: always

  frontend-app:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: lab-frontend-app
    depends_on:
      - api-gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    networks:
      - voting-network
    ports:
      - "3000:3000"
    restart: always

  # ----------------------------- Métricas -----------------------------
  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: lab-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - voting-network
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: lab-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/parent-distro/mnt/host/wsl|^/run/desktop/mnt/host/wsl|^/mnt/host/wsl"
    pid: host
    privileged: true
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lab-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "8081:8080"
    restart: unless-stopped

  # ----------------------------- Logs -----------------------------
  loki:
    image: grafana/loki:3.4.0
    container_name: lab-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - voting-network
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: lab-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - voting-network
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  # ----------------------------- Visualización -----------------------------
  grafana:
    image: grafana/grafana:12.4.0
    container_name: lab-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - voting-network
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.26.0
    container_name: lab-blackbox-exporter
    ports:
      - "9115:9115"
    restart: unless-stopped

networks:
  voting-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  postgres_data: