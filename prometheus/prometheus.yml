global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: api-gateway
    metrics_path: /health
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: blockchain-node
    static_configs:
      - targets: ['blockchain-node:9944']
